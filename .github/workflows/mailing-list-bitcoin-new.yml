name: Bitcoin-dev Mailing list
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      migration_mode:
        description: 'Migration mode'
        required: true
        default: 'test'
        type: choice
        options:
        - test
        - year
        - full
        - dry_run
        - historical
      migration_year:
        description: 'Year to process (for year mode)'
        required: false
        default: '2025'
        type: choice
        options:
        - '2025'
        - '2024'
        - '2023'
        - '2022'
        - '2021'
        - '2020'
        - '2019'
        - '2018'
        - '2017'
        - '2016'
        - '2015'
        - '2014'
        - '2013'
        - '2012'
        - '2011'
      dry_run:
        description: 'Dry run mode (preview only)'
        required: false
        default: false
        type: boolean
      historical_mode:
        description: 'Process existing ES data instead of downloading'
        required: false
        default: false
        type: boolean
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - uses: actions/setup-python@v2
        with:
          python-version: 3.9
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Fetch data
        run: |
          python mailing-list/main.py
        env:
            ES_ENGINE: ${{ secrets.ES_ENGINE }}
            ES_URL: ${{ secrets.ES_URL }}
            ES_TOKEN: ${{ secrets.ES_TOKEN }}
            CLOUD_ID: ${{ secrets.CLOUD_ID }}
            USER_PASSWORD: ${{ secrets.USER_PASSWORD }}
            USERNAME: ${{ secrets.USERNAME }}
            INDEX: ${{ secrets.INDEX }}
            DATA_DIR: /tmp/data
            MIGRATION_MODE: ${{ github.event.inputs.migration_mode || 'test' }}
            MIGRATION_YEAR: ${{ github.event.inputs.migration_year || '2025' }}
            DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
            HISTORICAL_MODE: ${{ github.event.inputs.historical_mode || 'false' }}
