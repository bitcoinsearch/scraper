name: Bitcoin-dev Mailing list
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      processing_mode:
        description: 'Processing mode'
        required: true
        default: 'single_year'
        type: choice
        options:
        - single_year
        - date_range
      target_year:
        description: 'Target year to process (for single year mode)'
        required: false
        default: '2023'
        type: string
      from_year:
        description: 'Start year for range processing (e.g., 2020)'
        required: false
        default: '2020'
        type: string
      to_year:
        description: 'End year for range processing (e.g., 2023)'
        required: false
        default: '2023'
        type: string
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - uses: actions/setup-python@v2
        with:
          python-version: 3.9
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Show processing configuration
        run: |
          if [ "${{ inputs.processing_mode }}" = "date_range" ]; then
            echo "🎯 Processing Bitcoin mailing list data for range: ${{ inputs.from_year || '2020' }} to ${{ inputs.to_year || '2023' }}"
            echo "📅 Processing mode: Date Range"
          else
            echo "🎯 Processing Bitcoin mailing list data for year: ${{ inputs.target_year || '2023' }}"
            echo "📅 Processing mode: Single Year"
          fi
          echo "ℹ️ Note: Data availability varies by year. Archive may not contain data before 2015."
      - name: Fetch data
        run: |
          python mailing-list/main.py
        env:
            ES_ENGINE: ${{ secrets.ES_ENGINE }}
            ES_URL: ${{ secrets.ES_URL }}
            ES_TOKEN: ${{ secrets.ES_TOKEN }}
            CLOUD_ID: ${{ secrets.CLOUD_ID }}
            USER_PASSWORD: ${{ secrets.USER_PASSWORD }}
            USERNAME: ${{ secrets.USERNAME }}
            INDEX: ${{ secrets.INDEX }}
            DATA_DIR: /tmp/data
            # Single year mode variables (backwards compatibility)
            TARGET_YEAR: ${{ inputs.target_year || '2023' }}
            FLEXIBLE_YEAR_PROCESSING: 'true'
            # Date range mode variables
            FROM_YEAR: ${{ inputs.processing_mode == 'date_range' && inputs.from_year || '' }}
            TO_YEAR: ${{ inputs.processing_mode == 'date_range' && inputs.to_year || '' }}
