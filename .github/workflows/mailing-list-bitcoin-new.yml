name: Bitcoin-dev Mailing list
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      target_year:
        description: 'Target year to process (e.g., 2023, 2024, 2025)'
        required: true
        default: '2023'
        type: string
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - uses: actions/setup-python@v2
        with:
          python-version: 3.9
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Show target year
        run: |
          echo "🎯 Processing Bitcoin mailing list data for year: ${{ inputs.target_year || '2023' }}"
      - name: Fetch data
        run: |
          python mailing-list/main.py
        env:
            ES_ENGINE: ${{ secrets.ES_ENGINE }}
            ES_URL: ${{ secrets.ES_URL }}
            ES_TOKEN: ${{ secrets.ES_TOKEN }}
            CLOUD_ID: ${{ secrets.CLOUD_ID }}
            USER_PASSWORD: ${{ secrets.USER_PASSWORD }}
            USERNAME: ${{ secrets.USERNAME }}
            INDEX: ${{ secrets.INDEX }}
            DATA_DIR: /tmp/data
            TARGET_YEAR: ${{ inputs.target_year || '2023' }}
